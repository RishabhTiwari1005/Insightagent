spring.application.name=insightagent
server.port=${PORT:8080}

# ---- App database (local dev = H2 file, prod profile = Postgres/Neon) ----
spring.datasource.url=jdbc:h2:file:./data/appdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- LLM: OpenAI by default, works with any OpenAI-compatible API (e.g. Groq) ----
spring.ai.openai.api-key=${OPENAI_API_KEY:missing}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.1
# only the chat model is used, switch the rest off
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ---- InsightAgent ----
insightagent.storage-dir=${STORAGE_DIR:./data/datasets}
insightagent.max-rows=200

vaadin.launch-browser=true
