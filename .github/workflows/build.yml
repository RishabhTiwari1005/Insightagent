name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test and build production JAR
        run: mvn -B -Pproduction package

      - uses: actions/upload-artifact@v4
        with:
          name: insightagent-jar
          path: target/insightagent.jar

